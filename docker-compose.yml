
services:
  pgvector_openbrain:
    container_name: pgvector_openbrain
    image: pgvector/pgvector:0.8.0-pg17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 62zpmOEpVYGKHGRA
      POSTGRES_DB: postgres
    restart: always 
    ports:
      - "9438:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data

  minio:
    container_name: openbrain_minio
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    restart: always
    ports:
      - "9002:9000"
      - "9003:9001"
    volumes:
      - ./minio_data:/data

